version: "2.4"

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # develop 一律指向下方的 MailHog，讓驗證與重設流程可完整測試
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      mailhog:
        condition: service_started

  # 攔截所有寄出的信件並提供 HTTP API 讀取。
  # 僅在 develop 啟動：正式環境應指向真實的 SMTP 服務。
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      # 1025 = SMTP（API 寄信用）、8025 = 網頁介面與 HTTP API
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
